services:
  dev-postgres:
    image: postgres:16
    container_name: simple_rss_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple_rss_development
    ports:
      - "5432:5432"
    volumes:
      - simple_rss_dev_data:/var/lib/postgresql/data

volumes:
  simple_rss_dev_data: